os aventures nautiques. Agencement élégant à deux cabines Montez à bord et soyez accueilli par un agencement à deux cabines soigneusement conçu. Avec des hébergements spacieux et un salon joliment aménagé, le confort et la détente sont au cœur de votre expérience. Améliorations intérieures haut de gamme À l'intérieur, vous constaterez que la moquette du bateau a été soigneusement retirée et remplacée par un parquet en bois brillant, ajoutant une touche de sophistication moderne à l'intérieur. Chaque détail a été pris en compte pour améliorer votre expérience à bord. Cockpit amélioré Le cockpit complet a été modernisé avec un tout nouveau SeaDeck, offrant à la fois un espace élégant et confortable pour le divertissement en plein air. Que vous receviez des invités ou que vous profitiez d'une soirée tranquille sur l'eau, ce bateau offre le cadre parfait. Idéalement situé à Miami Actuellement situé dans la ville dynamique de Miami, ce Sunseeker 44 Camargue est facile à voir et prêt pour son nouveau propriétaire. Ne manquez pas l'occasion de faire de ce bateau exceptionnel le vôtre et de vous lancer dans des voyages inoubliables sur l'océan. Contactez-nous dès aujourd'hui pour planifier une visite et découvrir le luxe et le prestige du Sunseeker 44 Camargue 2001. Votre prochaine aventure vous attend ! - Année : 2001 - Marque : Sunseeker - Modèle : 44 Camargue - Moteurs : Deux moteurs Caterpillar 3126 - Heures de moteur : 2500 heures - Bateau bien entretenu - Agencement à deux cabines - Design de salon spacieux - Moquette remplacée par un parquet en bois - Cockpit complet modernisé avec un nouveau SeaDeck - Actuellement situé à Miami - Facile à planifier des visites - Prêt pour un nouveau propriétaire","image":"https://images.boatsgroup.com/resize/1/57/95/9225795_20240206115404813_1_XLARGE.jpg","url":"https://www.yachtworld.fr/yacht/2001-sunseeker-camargue-44-9581379/","brand":{"@type":"Brand","name":"Sunseeker"},"offers":{"@type":"Offer","price":127808.22,"priceCurrency"
